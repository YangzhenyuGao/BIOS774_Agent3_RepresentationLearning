[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent3-replearn"
version = "0.1.0"
description = "Objective-aware multimodal biomedical representation learning"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml", "numpy", "scipy", "pandas", "scikit-learn"]

[project.scripts]
agent3 = "agent3_replearn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

